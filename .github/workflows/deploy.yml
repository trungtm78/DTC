name: Deploy

# Executable form of infra/pipelines/{staging,production}.json (docs/runbooks/infra/rollback.md).
# Staging follows every green CI run on main. Production is started by hand, needs the approval of the "production"
# environment (required reviewers are configured in the repository settings, not in this file) and promotes one tenant
# cohort at a time. The deploy mechanism itself is environment-specific: it is the command in the repository variable
# DEPLOY_COMMAND_STAGING or DEPLOY_COMMAND_PRODUCTION. While the variable is empty no cloud target is configured and the
# job reports that nothing was deployed; it never pretends to have deployed.
#
# Evidence is a commit status on the deployed commit: the staging job writes "deploy/staging" after a real deployment
# and the production job writes "deploy/production/<cohort>" after each promoted cohort. scripts/deploy-gate.mjs refuses
# a production run unless the exact commit has a green CI run and a green staging deployment, the cohort follows the
# canary order and the previous cohort has baked for the declared time. A deployment first writes the status "pending" and
# a failed or cancelled one writes "failure", so an earlier success never vouches for the latest attempt. Preflight
# resolves the commit once, and every later job checks out that SHA, never the moving branch or tag the dispatch named.
# The scripts (checks, gate) and the canary policy come from the revision of this workflow, checked out in .deploy-tools,
# because the release being deployed can be older than them.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cohort:
        description: Tenant cohort to promote (the order is the canary order of infra/pipelines/production.json)
        type: choice
        options: [pilot, cohort-1, all]
        required: true
      ref:
        description: Commit or tag to deploy (default is main)
        type: string
        default: main

permissions:
  contents: read

jobs:
  preflight:
    name: Infrastructure and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Resolve the commit once
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The checks come from the revision of this workflow and run against the release checked out above: a release older
      # than the tooling has no scripts/*.mjs of its own.
      - name: Check out the deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .deploy-tools
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Declarative infrastructure
        run: node .deploy-tools/scripts/infra-check.mjs --locale en --root .

      - name: Expand-contract migrations
        run: node .deploy-tools/scripts/expand-contract-check.mjs --locale en --root .

  staging:
    name: Staging
    needs: preflight
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      # The gate tooling and the canary policy come from the revision of this workflow, not from the release being
      # deployed: a release older than the tooling has no scripts/deploy-gate.mjs.
      - name: Check out the deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .deploy-tools
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Mark the staging deployment as started
        id: started
        if: vars.DEPLOY_COMMAND_STAGING != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: node .deploy-tools/scripts/deploy-gate.mjs record --locale en --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA" --context deploy/staging --state pending --description "Staging deployment started"

      - name: Deploy to staging
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND_STAGING }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then
            echo "::notice::No staging deploy target is configured (variable DEPLOY_COMMAND_STAGING is empty); nothing was deployed."
            exit 0
          fi
          bash -c "$DEPLOY_COMMAND"

      # Only a real deployment is evidence; with no target configured no status is written.
      - name: Record the staging deployment
        if: success() && vars.DEPLOY_COMMAND_STAGING != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: node .deploy-tools/scripts/deploy-gate.mjs record --locale en --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA" --context deploy/staging --state success --description "Deployed to staging"

      # A failed or cancelled attempt replaces the evidence of an earlier success: the attempt may have changed staging.
      - name: Record the failed staging deployment
        if: (failure() || cancelled()) && steps.started.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: node .deploy-tools/scripts/deploy-gate.mjs record --locale en --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA" --context deploy/staging --state failure --description "Staging deployment failed or was cancelled"

  # Early refusal, before the approvers are asked to approve a commit that cannot be promoted. The same check runs again
  # in the production job, after the approval and the concurrency lock, because the cohort state can change while waiting.
  gate:
    name: Production promotion gate
    needs: preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: read
    steps:
      # The gate tooling and the canary policy come from the revision of this workflow, not from the release being
      # deployed: a release older than the tooling has no scripts/deploy-gate.mjs.
      - name: Check out the deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .deploy-tools
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Green CI, green staging, canary order and bake time
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND_PRODUCTION }}
          DEPLOY_COHORT: ${{ inputs.cohort }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then
            echo "::notice::No production deploy target is configured (variable DEPLOY_COMMAND_PRODUCTION is empty); the gate was not evaluated."
            exit 0
          fi
          node .deploy-tools/scripts/deploy-gate.mjs check --locale en --root .deploy-tools --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA" --cohort "$DEPLOY_COHORT"

  production:
    name: Production (canary by cohort)
    needs: [preflight, gate]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Required reviewers of this environment are the manual approval of the production pipeline.
    environment: production
    permissions:
      contents: read
      actions: read
      statuses: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      # The gate tooling and the canary policy come from the revision of this workflow, not from the release being
      # deployed: a release older than the tooling has no scripts/deploy-gate.mjs.
      - name: Check out the deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .deploy-tools
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: No production target
        if: vars.DEPLOY_COMMAND_PRODUCTION == ''
        run: echo "::notice::No production deploy target is configured (variable DEPLOY_COMMAND_PRODUCTION is empty); nothing was deployed."

      - name: Check the promotion gate again
        if: vars.DEPLOY_COMMAND_PRODUCTION != ''
        env:
          DEPLOY_COHORT: ${{ inputs.cohort }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .deploy-tools/scripts/deploy-gate.mjs check --locale en --root .deploy-tools --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA" --cohort "$DEPLOY_COHORT"

      # From here on the cohort may be half deployed: the pending status takes the place of an earlier success, so the next
      # cohort can only be promoted by the latest attempt that succeeded.
      - name: Mark the cohort as being deployed
        id: started
        if: vars.DEPLOY_COMMAND_PRODUCTION != ''
        env:
          DEPLOY_COHORT: ${{ inputs.cohort }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .deploy-tools/scripts/deploy-gate.mjs record --locale en --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA" --context "deploy/production/$DEPLOY_COHORT" --state pending --description "Promotion to $DEPLOY_COHORT started"

      - name: Promote the cohort
        if: vars.DEPLOY_COMMAND_PRODUCTION != ''
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND_PRODUCTION }}
          DEPLOY_COHORT: ${{ inputs.cohort }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: bash -c "$DEPLOY_COMMAND"

      - name: Record the promoted cohort
        if: success() && vars.DEPLOY_COMMAND_PRODUCTION != ''
        env:
          DEPLOY_COHORT: ${{ inputs.cohort }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .deploy-tools/scripts/deploy-gate.mjs record --locale en --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA" --context "deploy/production/$DEPLOY_COHORT" --state success --description "Promoted to $DEPLOY_COHORT"

      - name: Record the failed promotion
        if: (failure() || cancelled()) && steps.started.outcome == 'success'
        env:
          DEPLOY_COHORT: ${{ inputs.cohort }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .deploy-tools/scripts/deploy-gate.mjs record --locale en --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA" --context "deploy/production/$DEPLOY_COHORT" --state failure --description "Promotion to $DEPLOY_COHORT failed or was cancelled"
