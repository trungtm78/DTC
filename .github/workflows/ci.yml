name: CI

# Executable form of AUTONOMOUS_EXECUTION_PROTOCOL.md: the same gates run locally through
# `node ci/src/verify-cli.mjs` before shipping. See ci/README.md for the gate-to-protocol mapping.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Protocol gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Design/MACHVON_Design/work/tools/package-lock.json

      - name: Install design tools dependencies
        working-directory: Design/MACHVON_Design/work/tools
        run: npm ci

      - name: Gate tests (90% line coverage floor)
        working-directory: ci
        run: npm test

      - name: Protocol gates on this change set
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node ci/src/verify-cli.mjs --base "$BASE_SHA" --locale en

      - name: Dependency audit (design tools)
        working-directory: Design/MACHVON_Design/work/tools
        run: npm audit --audit-level=high
